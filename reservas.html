<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fbf9f5] font-['Plus_Jakarta_Sans'] text-[#1b1c1a] antialiased">
    <!-- Header / Navbar -->
    <header class="fixed top-0 w-full z-50 bg-surface/95 backdrop-blur-xl border-b border-outline-variant/30 h-20 px-6">
        <div class="max-w-7xl mx-auto h-full flex items-center justify-between">
            <span class="font-['Playfair_Display'] text-xl font-bold tracking-tight text-[#9f3c16]">Aroma & Brasa</span>
            <nav class="hidden xl:flex items-center gap-2">
                <a class="px-3 py-1.5 text-stone-700 hover:text-stone-900 transition-colors text-sm" href="index.html">Inicio</a>
                <a class="px-3 py-1.5 text-stone-700 hover:text-stone-900 transition-colors text-sm" href="menu.html">Menú Digital</a>
                <a class="px-3 py-1.5 text-stone-700 hover:text-stone-900 transition-colors text-sm" href="galeria.html">Galería & Ambiente</a>
                <a class="px-3 py-1.5 bg-[#bf542c] text-white font-semibold rounded-full text-sm" href="reservas.html">Reservar Mesa</a>
            </nav>
        </div>
    </header>

    <main class="w-full pt-28 min-h-screen pb-20">
        <section class="max-w-3xl mx-auto px-6 py-12">
            <div class="text-center mb-10">
                <h1 class="font-['Playfair_Display'] text-4xl font-bold tracking-tight mb-3">
                    Reserva tu Experiencia
                </h1>
                <p class="text-stone-600">Asegura tu mesa en nuestra terraza jardín o en el salón principal junto a la cocina abierta.</p>
            </div>

            <!-- Formulario de Reservación -->
            <form class="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-stone-200/60 space-y-6" onsubmit="event.preventDefault(); alert('¡Reserva solicitada con éxito! Te contactaremos por correo de confirmación.');">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-2">Nombre Completo</label>
                        <input type="text" required placeholder="Ej. Sofía Martínez" class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:outline-none focus:border-[#9f3c16] text-sm"/>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-2">Correo Electrónico</label>
                        <input type="email" required placeholder="sofia@example.com" class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:outline-none focus:border-[#9f3c16] text-sm"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-2">Fecha</label>
                        <input type="date" required class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:outline-none focus:border-[#9f3c16] text-sm"/>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-2">Hora</label>
                        <select class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:outline-none focus:border-[#9f3c16] text-sm bg-white">
                            <option>12:30 PM (Almuerzo)</option>
                            <option>02:00 PM (Almuerzo)</option>
                            <option>07:00 PM (Cena)</option>
                            <option>08:30 PM (Cena)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-2">Comensales</label>
                        <select class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:outline-none focus:border-[#9f3c16] text-sm bg-white">
                            <option>1 Persona</option>
                            <option>2 Personas</option>
                            <option>3 - 4 Personas</option>
                            <option>5+ Personas (Grupo)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-2">Notas u Observaciones Especiales (Opcional)</label>
                    <textarea rows="3" placeholder="Alergias, celebraciones de cumpleaños o preferencia de zona..." class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:outline-none focus:border-[#9f3c16] text-sm"></textarea>
                </div>

                <button type="submit" class="w-full py-4 rounded-xl bg-[#9f3c16] text-white font-bold tracking-wide hover:bg-[#bf542c] transition-all shadow-md">
                    Confirmar Solicitud de Reserva
                </button>
            </form>
        </section>
    </main>
</body>
</html>
