<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fbf9f5] font-['Plus_Jakarta_Sans'] text-[#1b1c1a] antialiased">
    <main class="w-full pt-28 min-h-screen">
        <section class="max-w-7xl mx-auto px-6 py-12 text-center">
            <h1 class="font-['Playfair_Display'] text-4xl lg:text-5xl font-bold tracking-tight mb-4">
                Galería de Sabores, Texturas y Momentos
            </h1>
            <p class="text-stone-600 max-w-2xl mx-auto mb-8">
                Un recorrido visual por nuestra cocina abierta, la terraza con jardín botánico y la barra de café de especialidad.
            </p>
            <!-- Filtros interactivos -->
            <div class="flex flex-wrap items-center justify-center gap-2 p-1.5 rounded-full bg-stone-100 max-w-fit mx-auto shadow-sm" id="gallery-filters">
                <button class="filter-btn px-5 py-2.5 rounded-full font-semibold transition-all bg-[#1b1c1a] text-white text-sm" data-filter="all">Todo el ambiente</button>
                <button class="filter-btn px-5 py-2.5 rounded-full font-semibold transition-all text-stone-600 hover:text-black text-sm" data-filter="brasa">La Brasa & Horno</button>
                <button class="filter-btn px-5 py-2.5 rounded-full font-semibold transition-all text-stone-600 hover:text-black text-sm" data-filter="cafe">Café & Repostería</button>
            </div>
        </section>

        <!-- Grid de Galería -->
        <section class="max-w-7xl mx-auto px-6 pb-20">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-6 auto-rows-[280px]" id="gallery-grid">
                <div class="gallery-item group relative lg:col-span-8 lg:row-span-2 rounded-xl overflow-hidden bg-stone-200 cursor-pointer shadow-sm" data-category="brasa">
                    <div class="w-full h-full bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBFUTMzqmIcZHj-eDXpmpVEOnzGuEbk5RYP1OwG0Oz2vxhgrqBNSD9oUk8fbUiwAp44Vu1M3XWT5xFhB3eFaGc-bVQt_LCibDpLgWe8_iuzD1cR6uqCE2cS86B0Dk0DQcyi22JNlehEuGFNfFh5O_118PNZrEGYUHOK6OPRPoN9HX42AQ5jMMDDguYqkGZDKAWKlb2VIgoUYpjNQsrws4jNjZTmJvMYu6iCnWYi_ZS-5fdMFuqB7ramkg')"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-8 text-white">
                        <span class="px-2.5 py-0.5 rounded-full bg-[#9f3c16] text-white text-xs font-bold uppercase tracking-wider w-max mb-2">La Brasa Viva</span>
                        <h3 class="font-['Playfair_Display'] text-2xl font-bold">El Fuego de la Parcela</h3>
                        <p class="text-sm text-stone-200 mt-1">Cortes madurados con madera de encino guatemalteco.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript para filtrado de galería -->
    <script>
        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-[#1b1c1a]', 'text-white');
                    b.classList.add('text-stone-600');
                });
                btn.classList.add('bg-[#1b1c1a]', 'text-white');
                btn.classList.remove('text-stone-600');
                
                const filter = btn.getAttribute('data-filter');
                const items = document.querySelectorAll('.gallery-item');
                items.forEach(item => {
                    if (filter === 'all' || item.getAttribute('data-category') === filter) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
